<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>家系圖快速製作器</title>
<style>
  :root{
    --bg:#f4f6f8;
    --panel:#ffffff;
    --line:#d8dee6;
    --text:#1f2937;
    --muted:#667085;
    --accent:#355b7d;
    --accent-2:#24445f;
    --danger:#b42318;
    --ok:#147d64;
    --shadow:0 10px 28px rgba(31,41,55,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);background:var(--bg)}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .app{height:100%;display:grid;grid-template-rows:auto 1fr}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);gap:12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-weight:700;box-shadow:var(--shadow)}
  .brand h1{font-size:18px;margin:0;white-space:nowrap}
  .brand p{font-size:12px;margin:2px 0 0;color:var(--muted)}
  .header-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 11px;border-radius:9px;font-weight:600}
  .btn:hover{background:#f8fafc}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-2)}
  .btn.danger{color:var(--danger)}
  .btn.small{padding:6px 9px;font-size:13px}
  .layout{min-height:0;display:grid;grid-template-columns:310px minmax(0,1fr) 300px;gap:10px;padding:10px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:0;overflow:auto}
  .panel-title{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 14px;font-weight:700}
  .section{padding:14px;border-bottom:1px solid #edf0f3}
  .section:last-child{border-bottom:0}
  .section h3{font-size:14px;margin:0 0 9px}
  .hint{font-size:12px;line-height:1.6;color:var(--muted)}
  textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;line-height:1.55;background:#fbfcfd;color:var(--text)}
  textarea:focus,input:focus,select:focus{outline:2px solid rgba(53,91,125,.18);border-color:var(--accent)}
  .stack{display:grid;gap:8px}
  .row{display:flex;gap:8px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tool-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;text-align:left;display:flex;gap:9px;align-items:center;font-weight:600}
  .tool-btn:hover{border-color:#aeb8c4;background:#f8fafc}
  .symbol-mini{width:23px;height:23px;border:2px solid #111;display:inline-grid;place-items:center;font-size:12px;flex:0 0 auto}
  .symbol-mini.circle{border-radius:50%}
  .symbol-mini.diamond{transform:rotate(45deg)}
  .symbol-mini.diamond span{transform:rotate(-45deg)}
  .workspace-panel{position:relative;overflow:hidden;background:#e9edf1;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:0}
  .workspace-toolbar{position:absolute;z-index:10;left:12px;top:12px;display:flex;gap:6px;padding:6px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 24px rgba(31,41,55,.10)}
  .workspace-status{position:absolute;z-index:10;right:12px;top:12px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);font-size:12px;color:var(--muted)}
  #canvasWrap{width:100%;height:100%;overflow:hidden;touch-action:none}
  #canvas{width:100%;height:100%;display:block;background:#fff}
  .field{display:grid;gap:5px}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;min-height:auto}
  .field textarea{min-height:74px}
  .check{display:flex;align-items:center;gap:8px;font-size:13px}
  .empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
  .inspector-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .privacy{background:#f7fafc;border:1px solid #d7e3ea;border-radius:10px;padding:10px;font-size:12px;line-height:1.6;color:#40566a}
  .legend-list{display:grid;gap:8px;font-size:13px}
  .legend-item{display:flex;gap:9px;align-items:center}
  dialog{border:0;border-radius:14px;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.22);max-width:520px;width:calc(100% - 24px)}
  dialog::backdrop{background:rgba(24,34,45,.44)}
  .dialog-head{padding:15px 16px;border-bottom:1px solid var(--line);font-weight:700}
  .dialog-body{padding:16px;display:grid;gap:12px}
  .dialog-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#16202a;color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;transition:.2s;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .file-input{display:none}
  @media (max-width:1080px){
    .layout{grid-template-columns:270px minmax(0,1fr)}
    .right-panel{display:none}
  }
  @media (max-width:760px){
    header{align-items:flex-start;flex-direction:column}
    .header-actions{justify-content:flex-start}
    .layout{grid-template-columns:1fr;grid-template-rows:auto minmax(520px,1fr);overflow:auto}
    .left-panel{max-height:none}
    .workspace-panel{min-height:620px}
  }
  @media print{
    header,.left-panel,.right-panel,.workspace-toolbar,.workspace-status{display:none!important}
    body,.app,.layout,.workspace-panel,#canvasWrap{background:#fff!important;height:auto!important;overflow:visible!important;border:0!important;box-shadow:none!important;padding:0!important;margin:0!important}
    .layout{display:block!important}
    #canvas{width:100%!important;height:auto!important}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-mark">系</div>
      <div>
        <h1>家系圖快速製作器</h1>
        <p>常見社工家系圖符號｜離線可用｜資料留在瀏覽器</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn small" id="saveProjectBtn">儲存專案</button>
      <label class="btn small" for="loadProjectInput">載入專案</label>
      <input class="file-input" id="loadProjectInput" type="file" accept="application/json" />
      <button class="btn small" id="exportSvgBtn">匯出 SVG</button>
      <button class="btn small" id="exportPngBtn">匯出 PNG</button>
      <button class="btn small" id="printBtn">列印／PDF</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel left-panel">
      <div class="panel-title">快速建立</div>
      <section class="section">
        <h3>文字轉家系圖</h3>
        <textarea id="quickInput" spellcheck="false">個案：女性，80歲，在家照顧
配偶：男性，已歿
長男：55歲，婚配三次，第一次有1子28歲，第二次無子女，第三次有1女16歲
次女：50歲，未婚
三女：48歲，已婚，育有一子(15歲)</textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn primary" id="parseBtn" style="flex:1">產生家系圖</button>
          <button class="btn" id="sampleBtn">載入範例</button>
        </div>
        <p class="hint">支援「個案、配偶、長男、次女、已婚、未婚、已歿、育有一子／女、婚配三次」等常見描述。解析後仍可逐項修改。</p>
      </section>

      <section class="section">
        <h3>新增物件</h3>
        <div class="tool-grid">
          <button class="tool-btn" data-add-node="male"><span class="symbol-mini"></span>男性</button>
          <button class="tool-btn" data-add-node="female"><span class="symbol-mini circle"></span>女性</button>
          <button class="tool-btn" data-add-node="unknown"><span class="symbol-mini diamond"><span>?</span></span>性別未明</button>
          <button class="tool-btn" id="addTextBtn"><span style="font-weight:800;font-size:20px">T</span>文字</button>
          <button class="tool-btn" id="addFrameBtn"><span style="width:26px;height:19px;border:2px dashed #111"></span>外框</button>
          <button class="tool-btn" id="addRelationBtn"><span style="font-size:20px">↔</span>關係線</button>
        </div>
      </section>

      <section class="section">
        <h3>排列與畫布</h3>
        <div class="stack">
          <button class="btn" id="autoLayoutBtn">自動排列世代</button>
          <div class="grid2">
            <button class="btn" id="undoBtn">復原</button>
            <button class="btn" id="redoBtn">重做</button>
          </div>
          <button class="btn danger" id="clearBtn">清空畫布</button>
        </div>
      </section>

      <section class="section">
        <h3>符號說明</h3>
        <div class="legend-list">
          <div class="legend-item"><span class="symbol-mini"></span>男性</div>
          <div class="legend-item"><span class="symbol-mini circle"></span>女性</div>
          <div class="legend-item"><span class="symbol-mini" style="position:relative">╳</span>已歿</div>
          <div class="legend-item"><span class="symbol-mini" style="box-shadow:0 0 0 3px #fff,0 0 0 5px #111"></span>案主／個案（雙框）</div>
          <div class="legend-item"><span style="display:inline-block;width:34px;border-top:2px solid #111"></span>婚姻／伴侶關係</div>
          <div class="legend-item"><span style="display:inline-block;width:34px;border-top:2px dashed #111"></span>同居</div>
        </div>
        <p class="hint">本工具採台灣社工實務常見的家系圖表達方式。不同機構若有內規，請以單位規範為準。</p>
      </section>

      <section class="section">
        <div class="privacy"><strong>個資提醒：</strong>專案預設只存於目前瀏覽器，不會自動上傳。正式個案資料仍請依機構個資與資訊安全規範處理。</div>
      </section>
    </aside>

    <section class="workspace-panel">
      <div class="workspace-toolbar">
        <button class="btn small" id="zoomOutBtn">－</button>
        <button class="btn small" id="zoomResetBtn">100%</button>
        <button class="btn small" id="zoomInBtn">＋</button>
        <button class="btn small" id="fitBtn">適合畫面</button>
      </div>
      <div class="workspace-status" id="statusText">點選物件可編輯；拖曳可移動</div>
      <div id="canvasWrap">
        <svg id="canvas" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" aria-label="家系圖畫布">
          <defs>
            <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L8,4 L0,8 Z" fill="#111"/>
            </marker>
          </defs>
          <rect x="0" y="0" width="1400" height="900" fill="#fff"/>
          <g id="frameLayer"></g>
          <g id="relationLayer"></g>
          <g id="nodeLayer"></g>
          <g id="textLayer"></g>
          <g id="selectionLayer"></g>
        </svg>
      </div>
    </section>

    <aside class="panel right-panel">
      <div class="panel-title">屬性編輯</div>
      <div id="inspector" class="empty">請先點選人物、關係線、文字或外框。</div>
    </aside>
  </main>
</div>

<dialog id="relationDialog">
  <div class="dialog-head">新增關係線</div>
  <div class="dialog-body">
    <div class="field">
      <label>關係類型</label>
      <select id="relationType">
        <option value="partner">婚姻／伴侶</option>
        <option value="parent">親子</option>
        <option value="care">照顧／支持箭頭</option>
        <option value="conflict">衝突關係</option>
        <option value="close">親密關係</option>
        <option value="cutoff">關係中斷</option>
      </select>
    </div>
    <div class="field">
      <label>起點人物</label>
      <select id="relationFrom"></select>
    </div>
    <div class="field">
      <label>終點人物</label>
      <select id="relationTo"></select>
    </div>
    <div class="field" id="partnerStatusField">
      <label>伴侶狀態</label>
      <select id="partnerStatus">
        <option value="married">婚姻</option>
        <option value="cohabiting">同居</option>
        <option value="separated">分居</option>
        <option value="divorced">離婚</option>
      </select>
    </div>
    <div class="field">
      <label>標籤（選填）</label>
      <input id="relationLabel" placeholder="例如：主要照顧、經濟支持" />
    </div>
  </div>
  <div class="dialog-foot">
    <button class="btn" id="cancelRelationBtn">取消</button>
    <button class="btn primary" id="confirmRelationBtn">新增</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => [...document.querySelectorAll(sel)];
  const canvas = $('#canvas');
  const frameLayer = $('#frameLayer');
  const relationLayer = $('#relationLayer');
  const nodeLayer = $('#nodeLayer');
  const textLayer = $('#textLayer');
  const selectionLayer = $('#selectionLayer');
  const inspector = $('#inspector');
  const statusText = $('#statusText');
  const toast = $('#toast');

  const defaultState = () => ({
    version: 1,
    nodes: [],
    relations: [],
    frames: [],
    texts: [],
    selected: null,
    zoom: 1,
    panX: 0,
    panY: 0
  });

  let state = defaultState();
  let history = [];
  let future = [];
  let drag = null;
  let pan = null;
  let toastTimer = null;

  const uid = (prefix) => prefix + '_' + Math.random().toString(36).slice(2, 9);
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nodeLabel = n => [n.name || '', n.age ? `${n.age}歲` : '', n.note || ''].filter(Boolean).join('／') || `${sexName(n.sex)}成員`;
  const sexName = sex => ({male:'男性',female:'女性',unknown:'性別未明'}[sex] || '成員');

  function snapshot(){
    history.push(JSON.stringify({...state, selected:null}));
    if(history.length > 80) history.shift();
    future = [];
  }

  function undo(){
    if(!history.length) return showToast('沒有可復原的動作');
    future.push(JSON.stringify({...state, selected:null}));
    state = JSON.parse(history.pop());
    render(); persist();
  }

  function redo(){
    if(!future.length) return showToast('沒有可重做的動作');
    history.push(JSON.stringify({...state, selected:null}));
    state = JSON.parse(future.pop());
    render(); persist();
  }

  function persist(){
    try{ localStorage.setItem('genogram-builder-state', JSON.stringify({...state, selected:null})); }catch(e){}
  }

  function restore(){
    try{
      const raw = localStorage.getItem('genogram-builder-state');
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && parsed.nodes) state = {...defaultState(), ...parsed, selected:null};
      }
    }catch(e){}
  }

  function showToast(msg){
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function svgEl(name, attrs={}){
    const el = document.createElementNS(SVG_NS, name);
    Object.entries(attrs).forEach(([k,v]) => {
      if(v !== undefined && v !== null) el.setAttribute(k, v);
    });
    return el;
  }

  function getSvgPoint(evt){
    const pt = canvas.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const ctm = canvas.getScreenCTM();
    return pt.matrixTransform(ctm.inverse());
  }

  function normalizeNode(n){
    return {
      id:n.id || uid('n'),
      name:n.name || '',
      sex:n.sex || 'unknown',
      age:n.age || '',
      deceased:!!n.deceased,
      proband:!!n.proband,
      note:n.note || '',
      x:Number(n.x ?? 700),
      y:Number(n.y ?? 450),
      size:Number(n.size ?? 58)
    };
  }

  function addNode(sex='unknown', props={}){
    snapshot();
    const n = normalizeNode({sex, x:700, y:450, ...props});
    state.nodes.push(n);
    state.selected = {kind:'node', id:n.id};
    render(); persist();
    return n;
  }

  function addFrame(){
    snapshot();
    const f = {id:uid('f'), x:420, y:240, width:560, height:360, label:'同住／家庭範圍', dashed:false, rounded:true};
    state.frames.push(f);
    state.selected = {kind:'frame', id:f.id};
    render(); persist();
  }

  function addText(){
    snapshot();
    const t = {id:uid('t'), x:700, y:150, text:'文字說明', fontSize:22, bold:false};
    state.texts.push(t);
    state.selected = {kind:'text', id:t.id};
    render(); persist();
  }

  function addRelation(from, to, type='partner', opts={}){
    if(!from || !to || from === to) return;
    const r = {
      id:uid('r'), from, to, type,
      status:opts.status || 'married',
      label:opts.label || ''
    };
    state.relations.push(r);
    state.selected = {kind:'relation', id:r.id};
    return r;
  }

  function getNode(id){ return state.nodes.find(n => n.id === id); }
  function getRelation(id){ return state.relations.find(r => r.id === id); }
  function getFrame(id){ return state.frames.find(f => f.id === id); }
  function getText(id){ return state.texts.find(t => t.id === id); }

  function render(){
    frameLayer.innerHTML = '';
    relationLayer.innerHTML = '';
    nodeLayer.innerHTML = '';
    textLayer.innerHTML = '';
    selectionLayer.innerHTML = '';

    state.frames.forEach(drawFrame);
    state.relations.forEach(drawRelation);
    state.nodes.forEach(drawNode);
    state.texts.forEach(drawText);
    drawSelection();
    renderInspector();
    updateStatus();
  }

  function drawFrame(f){
    const g = svgEl('g', {'data-kind':'frame','data-id':f.id, class:'draggable'});
    const rect = svgEl('rect', {
      x:f.x,y:f.y,width:f.width,height:f.height,rx:f.rounded?24:0,
      fill:'none',stroke:'#111','stroke-width':2.2,'stroke-dasharray':f.dashed?'9 6':''
    });
    const labelBg = svgEl('rect', {x:f.x+12,y:f.y-14,width:Math.max(92,(f.label||'').length*17),height:28,rx:7,fill:'#fff'});
    const label = svgEl('text', {x:f.x+20,y:f.y+6,'font-size':17,'font-weight':600,fill:'#111'});
    label.textContent = f.label || '外框';
    g.append(rect,labelBg,label);
    g.addEventListener('pointerdown', startDrag);
    g.addEventListener('click', selectFromEvent);
    frameLayer.appendChild(g);
  }

  function nodeEdgePoint(n, toward){
    const dx = toward.x - n.x;
    const dy = toward.y - n.y;
    const len = Math.hypot(dx,dy) || 1;
    const r = n.size/2 + 2;
    if(n.sex === 'male'){
      const scale = r / Math.max(Math.abs(dx), Math.abs(dy), 1);
      return {x:n.x + dx*scale, y:n.y + dy*scale};
    }
    return {x:n.x + dx/len*r, y:n.y + dy/len*r};
  }

  function drawRelation(r){
    const a = getNode(r.from), b = getNode(r.to);
    if(!a || !b) return;
    const g = svgEl('g', {'data-kind':'relation','data-id':r.id});
    const p1 = nodeEdgePoint(a,b), p2 = nodeEdgePoint(b,a);

    let path;
    if(r.type === 'parent'){
      // 若同一名子女的兩位家長彼此有伴侶關係，只畫一條由伴侶線中點出發的親子線。
      const coParentRels = state.relations.filter(x => x.type === 'parent' && x.to === r.to && x.from !== r.from);
      const paired = coParentRels.find(x => state.relations.some(pr => pr.type === 'partner' && ((pr.from === r.from && pr.to === x.from) || (pr.to === r.from && pr.from === x.from))));
      if(paired){
        const canonical = [r, paired].sort((x,y) => x.id.localeCompare(y.id))[0];
        if(canonical.id !== r.id) return;
        const other = getNode(paired.from);
        if(!other) return;
        const source = {x:(a.x+other.x)/2, y:(a.y+other.y)/2};
        const target = nodeEdgePoint(b, source);
        const midY = source.y + (target.y-source.y)*0.48;
        path = svgEl('path', {d:`M ${source.x} ${source.y} V ${midY} H ${target.x} V ${target.y}`,fill:'none',stroke:'#111','stroke-width':2.2});
      }else{
        const midY = p1.y + (p2.y-p1.y)*0.48;
        path = svgEl('path', {d:`M ${p1.x} ${p1.y} V ${midY} H ${p2.x} V ${p2.y}`,fill:'none',stroke:'#111','stroke-width':2.2});
      }
    }else if(r.type === 'care'){
      path = svgEl('path', {d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`,fill:'none',stroke:'#111','stroke-width':2.2,'marker-end':'url(#arrow)'});
    }else if(r.type === 'conflict'){
      path = zigzagPath(p1,p2);
    }else if(r.type === 'close'){
      const path2 = parallelLine(p1,p2,5);
      g.appendChild(svgEl('path',{d:path2[0],fill:'none',stroke:'#111','stroke-width':2}));
      g.appendChild(svgEl('path',{d:path2[1],fill:'none',stroke:'#111','stroke-width':2}));
      path = null;
    }else if(r.type === 'cutoff'){
      path = svgEl('path',{d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`,fill:'none',stroke:'#111','stroke-width':2.2});
      const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
      const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x)+Math.PI/2;
      const dx=Math.cos(ang)*12, dy=Math.sin(ang)*12;
      g.appendChild(svgEl('line',{x1:mx-dx,y1:my-dy,x2:mx+dx,y2:my+dy,stroke:'#111','stroke-width':2.4}));
    }else{
      path = svgEl('path', {d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`,fill:'none',stroke:'#111','stroke-width':2.2,'stroke-dasharray':r.status==='cohabiting'?'8 5':''});
      const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
      if(r.status === 'separated' || r.status === 'divorced'){
        const count = r.status === 'divorced' ? 2 : 1;
        const angle = Math.atan2(p2.y-p1.y,p2.x-p1.x)+Math.PI/2;
        for(let i=0;i<count;i++){
          const off=(i-(count-1)/2)*8;
          const cx=mx+Math.cos(Math.atan2(p2.y-p1.y,p2.x-p1.x))*off;
          const cy=my+Math.sin(Math.atan2(p2.y-p1.y,p2.x-p1.x))*off;
          const dx=Math.cos(angle)*10, dy=Math.sin(angle)*10;
          g.appendChild(svgEl('line',{x1:cx-dx,y1:cy-dy,x2:cx+dx,y2:cy+dy,stroke:'#111','stroke-width':2.3}));
        }
      }
    }
    if(path) g.prepend(path);

    if(r.label){
      const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
      const txt=svgEl('text',{x:mx,y:my-10,'font-size':15,'text-anchor':'middle',fill:'#111'});
      txt.textContent=r.label;
      g.appendChild(txt);
    }
    const hit=svgEl('path',{d:path?.getAttribute('d') || `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`,fill:'none',stroke:'transparent','stroke-width':18});
    g.appendChild(hit);
    g.addEventListener('click',selectFromEvent);
    relationLayer.appendChild(g);
  }

  function zigzagPath(p1,p2){
    const n=10, pts=[];
    const dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len;
    for(let i=0;i<=n;i++){
      const t=i/n, amp=(i===0||i===n)?0:(i%2?7:-7);
      pts.push([p1.x+dx*t+nx*amp,p1.y+dy*t+ny*amp]);
    }
    return svgEl('path',{d:pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' '),fill:'none',stroke:'#111','stroke-width':2.2});
  }

  function parallelLine(p1,p2,offset){
    const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len*offset,ny=dx/len*offset;
    return [
      `M ${p1.x+nx} ${p1.y+ny} L ${p2.x+nx} ${p2.y+ny}`,
      `M ${p1.x-nx} ${p1.y-ny} L ${p2.x-nx} ${p2.y-ny}`
    ];
  }

  function drawNode(n){
    const g = svgEl('g', {'data-kind':'node','data-id':n.id, class:'draggable', transform:`translate(${n.x},${n.y})`});
    const r=n.size/2;
    const common={fill:n.proband?'#e4e9ed':'#fff',stroke:'#111','stroke-width':2.4};
    let shape;
    if(n.sex==='male') shape=svgEl('rect',{x:-r,y:-r,width:n.size,height:n.size,...common});
    else if(n.sex==='female') shape=svgEl('circle',{cx:0,cy:0,r,...common});
    else shape=svgEl('polygon',{points:`0,${-r} ${r},0 0,${r} ${-r},0`,...common});
    g.appendChild(shape);
    if(n.proband){
      let inner;
      if(n.sex==='male') inner=svgEl('rect',{x:-r+6,y:-r+6,width:n.size-12,height:n.size-12,fill:'none',stroke:'#111','stroke-width':1.7});
      else if(n.sex==='female') inner=svgEl('circle',{cx:0,cy:0,r:r-6,fill:'none',stroke:'#111','stroke-width':1.7});
      else inner=svgEl('polygon',{points:`0,${-r+7} ${r-7},0 0,${r-7} ${-r+7},0`,fill:'none',stroke:'#111','stroke-width':1.7});
      g.appendChild(inner);
    }
    if(n.deceased){
      g.appendChild(svgEl('line',{x1:-r+5,y1:-r+5,x2:r-5,y2:r-5,stroke:'#111','stroke-width':2.3}));
      g.appendChild(svgEl('line',{x1:-r+5,y1:r-5,x2:r-5,y2:-r+5,stroke:'#111','stroke-width':2.3}));
    }
    if(n.age){
      const age=svgEl('text',{x:0,y:8,'font-size':23,'text-anchor':'middle',fill:'#111','font-weight':500});
      age.textContent=n.age;
      g.appendChild(age);
    }
    const caption=[n.name,n.note].filter(Boolean).join('・');
    if(caption){
      const txt=svgEl('text',{x:0,y:r+25,'font-size':16,'text-anchor':'middle',fill:'#111'});
      txt.textContent=caption;
      g.appendChild(txt);
    }
    g.addEventListener('pointerdown',startDrag);
    g.addEventListener('click',selectFromEvent);
    nodeLayer.appendChild(g);
  }

  function drawText(t){
    const g=svgEl('g',{'data-kind':'text','data-id':t.id,class:'draggable',transform:`translate(${t.x},${t.y})`});
    const txt=svgEl('text',{x:0,y:0,'font-size':t.fontSize||22,'font-weight':t.bold?700:400,fill:'#111'});
    txt.textContent=t.text||'文字';
    g.appendChild(txt);
    g.addEventListener('pointerdown',startDrag);
    g.addEventListener('click',selectFromEvent);
    textLayer.appendChild(g);
  }

  function drawSelection(){
    if(!state.selected) return;
    const {kind,id}=state.selected;
    let box=null;
    if(kind==='node'){
      const n=getNode(id); if(!n) return;
      const pad=10,r=n.size/2;
      box={x:n.x-r-pad,y:n.y-r-pad,w:n.size+pad*2,h:n.size+pad*2};
    }else if(kind==='frame'){
      const f=getFrame(id); if(!f) return;
      box={x:f.x-7,y:f.y-7,w:f.width+14,h:f.height+14};
    }else if(kind==='text'){
      const t=getText(id); if(!t) return;
      box={x:t.x-8,y:t.y-(t.fontSize||22)-8,w:Math.max(80,(t.text||'').length*(t.fontSize||22)*.95),h:(t.fontSize||22)+18};
    }
    if(box){
      selectionLayer.appendChild(svgEl('rect',{x:box.x,y:box.y,width:box.w,height:box.h,rx:6,fill:'none',stroke:'#355b7d','stroke-width':2,'stroke-dasharray':'6 4','pointer-events':'none'}));
      if(kind==='frame'){
        const handle=svgEl('rect',{x:box.x+box.w-7,y:box.y+box.h-7,width:14,height:14,fill:'#fff',stroke:'#355b7d','stroke-width':2,'data-resize-frame':id});
        handle.style.cursor='nwse-resize';
        handle.addEventListener('pointerdown',startResizeFrame);
        selectionLayer.appendChild(handle);
      }
    }
  }

  function selectFromEvent(evt){
    evt.stopPropagation();
    const g=evt.currentTarget;
    state.selected={kind:g.dataset.kind,id:g.dataset.id};
    render();
  }

  function startDrag(evt){
    if(evt.button!==0) return;
    evt.stopPropagation();
    const g=evt.currentTarget;
    const kind=g.dataset.kind,id=g.dataset.id;
    const point=getSvgPoint(evt);
    const obj=kind==='node'?getNode(id):kind==='frame'?getFrame(id):getText(id);
    if(!obj) return;
    snapshot();
    drag={kind,id,startX:point.x,startY:point.y,origX:obj.x,origY:obj.y,moved:false};
    state.selected={kind,id};
    canvas.setPointerCapture(evt.pointerId);
  }

  function startResizeFrame(evt){
    evt.stopPropagation();
    const id=evt.currentTarget.dataset.resizeFrame;
    const f=getFrame(id); if(!f) return;
    snapshot();
    const p=getSvgPoint(evt);
    drag={kind:'resizeFrame',id,startX:p.x,startY:p.y,origW:f.width,origH:f.height,moved:false};
    canvas.setPointerCapture(evt.pointerId);
  }

  canvas.addEventListener('pointermove',evt=>{
    if(drag){
      const p=getSvgPoint(evt);
      drag.moved=true;
      if(drag.kind==='resizeFrame'){
        const f=getFrame(drag.id); if(!f) return;
        f.width=clamp(drag.origW+(p.x-drag.startX),120,1200);
        f.height=clamp(drag.origH+(p.y-drag.startY),80,800);
      }else{
        const obj=drag.kind==='node'?getNode(drag.id):drag.kind==='frame'?getFrame(drag.id):getText(drag.id);
        if(!obj) return;
        obj.x=drag.origX+(p.x-drag.startX);
        obj.y=drag.origY+(p.y-drag.startY);
      }
      render();
    }else if(pan){
      const dx=evt.clientX-pan.x,dy=evt.clientY-pan.y;
      const vb=canvas.viewBox.baseVal;
      vb.x=pan.vx-dx/vb.width*1400;
      vb.y=pan.vy-dy/vb.height*900;
    }
  });

  canvas.addEventListener('pointerup',evt=>{
    if(drag){ persist(); drag=null; }
    pan=null;
    try{canvas.releasePointerCapture(evt.pointerId)}catch(e){}
  });

  canvas.addEventListener('pointerdown',evt=>{
    if(evt.target===canvas || evt.target.tagName==='rect' && evt.target.parentElement===canvas){
      state.selected=null; render();
    }
    if(evt.button===1 || evt.altKey){
      const vb=canvas.viewBox.baseVal;
      pan={x:evt.clientX,y:evt.clientY,vx:vb.x,vy:vb.y};
      canvas.setPointerCapture(evt.pointerId);
    }
  });

  canvas.addEventListener('wheel',evt=>{
    evt.preventDefault();
    const factor=evt.deltaY<0?.9:1.1;
    const vb=canvas.viewBox.baseVal;
    const p=getSvgPoint(evt);
    const nw=clamp(vb.width*factor,500,2800),nh=nw*900/1400;
    vb.x=p.x-(p.x-vb.x)*(nw/vb.width);
    vb.y=p.y-(p.y-vb.y)*(nh/vb.height);
    vb.width=nw;vb.height=nh;
    updateZoomButton();
  },{passive:false});

  function renderInspector(){
    if(!state.selected){ inspector.className='empty'; inspector.innerHTML='請先點選人物、關係線、文字或外框。'; return; }
    inspector.className='section';
    const {kind,id}=state.selected;
    if(kind==='node') renderNodeInspector(getNode(id));
    if(kind==='relation') renderRelationInspector(getRelation(id));
    if(kind==='frame') renderFrameInspector(getFrame(id));
    if(kind==='text') renderTextInspector(getText(id));
  }

          <div class="field"><label>性別</label><select data-k="sex"><option value="male" ${n.sex==='male'?'selected':''}>男性</option><option value="female" ${n.sex==='female'?'selected':''}>女性</option><option value="unknown" ${n.sex==='unknown'?'selected':''}>性別未明</option></select></div>

  function renderRelationInspector(r){

      <div class="stack">

          ${[['partner','婚姻／伴侶'],['parent','親子'],['care','照顧／支持箭頭'],['conflict','衝突'],['close','親密'],['cutoff','關係中斷']].map(([v,l])=>`<option value="${v}" ${r.type===v?'selected':''}>${l}</option>`).join('')}
        </select></div>
        <div class="field"><label>伴侶狀態</label><select data-k="status"><option value="married" ${r.status==='married'?'selected':''}>婚姻</option><option value="cohabiting" ${r.status==='cohabiting'?'selected':''}>同居</option><option value="separated" ${r.status==='separated'?'selected':''}>分居</option><option value="divorced" ${r.status==='divorced'?'selected':''}>離婚</option></select></div>
        <div class="field"><label>標籤</label><input data-k="label" value="${esc(r.label)}" placeholder="例如：主要照顧"/></div>

  function renderFrameInspector(f){
    if(!f) return;
    inspector.innerHTML=`
      <div class="stack">
        <div class="field"><label>框線標題</label><input data-k="label" value="${esc(f.label)}" /></div>
        <div class="grid2"><div class="field"><label>寬度</label><input type="number" data-k="width" value="${Math.round(f.width)}" /></div><div class="field"><label>高度</label><input type="number" data-k="height" value="${Math.round(f.height)}" /></div></div>
        <label class="check"><input type="checkbox" data-k="dashed" ${f.dashed?'checked':''}/> 虛線框</label>
        <label class="check"><input type="checkbox" data-k="rounded" ${f.rounded?'checked':''}/> 圓角</label>
        <div class="inspector-actions"><button class="btn danger" data-delete>刪除此外框</button></div>
      </div>`;
    bindInspector(f,'frame');

    if(!t) return;
    inspector.innerHTML=`
      <div class="stack">
        <div class="field"><label>文字內容</label><textarea data-k="text">${esc(t.text)}</textarea></div>
        <div class="field"><label>字級</label><input type="range" min="12" max="48" value="${t.fontSize}" data-k="fontSize" /></div>
        <label class="check"><input type="checkbox" data-k="bold" ${t.bold?'checked':''}/> 粗體</label>
        <div class="inspector-actions"><button class="btn danger" data-delete>刪除此文字</button></div>
      </div>`;

  function bindInspector(obj,kind){
    inspector.querySelectorAll('[data-k]').forEach(el=>{
      const event = (el.type==='checkbox'||el.tagName==='SELECT'||el.type==='range')?'change':'input';
      el.addEventListener(event,()=>{
        snapshot();
        let val = el.type==='checkbox'?el.checked:el.value;
        if(['size','width','height','fontSize'].includes(el.dataset.k)) val=Number(val);
        obj[el.dataset.k]=val;
        render(); persist();
      },{once:false});
    });
    inspector.querySelector('[data-delete]')?.addEventListener('click',()=>deleteSelected(kind,obj.id));
  }

  function deleteSelected(kind,id){
    snapshot();
    if(kind==='node'){
      state.nodes=state.nodes.filter(n=>n.id!==id);
      state.relations=state.relations.filter(r=>r.from!==id&&r.to!==id);
    }else if(kind==='relation') state.relations=state.relations.filter(r=>r.id!==id);
    else if(kind==='frame') state.frames=state.frames.filter(f=>f.id!==id);
    else if(kind==='text') state.texts=state.texts.filter(t=>t.id!==id);
    state.selected=null; render();persist();
  }

  function updateStatus(){
    const n=state.nodes.length,r=state.relations.length;
    statusText.textContent=`人物 ${n}｜關係 ${r}｜點選可編輯，拖曳可移動`;
  }

  function populateRelationSelects(){
    const opts=state.nodes.map(n=>`<option value="${n.id}">${esc(nodeLabel(n))}</option>`).join('');
    $('#relationFrom').innerHTML=opts;
    $('#relationTo').innerHTML=opts;
  }

  function parseAge(text){
    const m=String(text).match(/(\d{1,3})\s*歲?/);
    return m?m[1]:'';
  }

  function inferSex(label,text=''){
    if(/男|子/.test(label+text) && !/女/.test(label+text)) return 'male';
    if(/女/.test(label+text)) return 'female';
    return 'unknown';
  }

  function parseQuickInput(raw){
    const lines=raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    const nodes=[],relations=[];
    let proband=null, spouse=null;
    const children=[];
    const newNode=(p)=>{const n=normalizeNode({...p,id:uid('n')});nodes.push(n);return n;};
    const rel=(a,b,type='partner',opts={})=>relations.push({id:uid('r'),from:a.id,to:b.id,type,status:opts.status||'married',label:opts.label||''});

    for(const line of lines){
      const [headRaw,...restParts]=line.split(/[：:]/);
      const head=(headRaw||'').trim();
      const body=restParts.join('：').trim();
      if(/個案|案主/.test(head)){
        const sex=/女/.test(body)?'female':/男/.test(body)?'male':'unknown';
        proband=newNode({name:'個案',sex,age:parseAge(body),deceased:/已歿|死亡/.test(body),proband:true,note:/在家照顧/.test(body)?'在家照顧':''});
      }else if(/配偶/.test(head)){
        const sex=/女/.test(body)?'female':/男/.test(body)?'male':'unknown';
        spouse=newNode({name:'配偶',sex,age:parseAge(body),deceased:/已歿|死亡/.test(body)});
      }else if(/長|次|三|四|五|六|七|八|九|么/.test(head)){
        const sex=inferSex(head,body);
        const child=newNode({name:head,sex,age:parseAge(body),note:/未婚/.test(body)?'未婚':''});
        children.push(child);
        // marriage cases
        const marriageCountMatch=body.match(/婚配\s*([一二三四五六七八九十\d]+)\s*次/);
        let marriageCount=0;
        if(marriageCountMatch){
          const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
          marriageCount=Number(marriageCountMatch[1]) || map[marriageCountMatch[1]] || 0;
        }else if(/已婚/.test(body)) marriageCount=1;
        for(let i=1;i<=marriageCount;i++){
          const partnerName = marriageCount === 1 ? '配偶' : `第${['一','二','三','四','五'][i-1]||i}任配偶`;
          const partner=newNode({name:partnerName,sex:sex==='male'?'female':sex==='female'?'male':'unknown'});
          rel(child,partner,'partner',{status:'married'});
          let seg='';
          const ord=['一','二','三','四','五'][i-1]||i;
          const m=body.match(new RegExp(`第${ord}次([\\s\\S]*?)(?=第[一二三四五]次|$)`));
          if(m) seg=m[1];
          if(i===1 && !seg && marriageCount===1) seg=body;
          const childMatches=[...seg.matchAll(/(?:有|育有)?\s*(?:1|一)?\s*(子|女)\s*[（(]?\s*(\d{1,3})\s*歲?\s*[)）]?/g)];
          childMatches.forEach((cm,idx)=>{
            const c=newNode({name:cm[1]==='子'?'子':'女',sex:cm[1]==='子'?'male':'female',age:cm[2]});
            rel(child,c,'parent');
            rel(partner,c,'parent');
          });
        }
        // general child patterns for single marriage
        if(marriageCount===1){
          const partnerRel=relations.find(r=>r.type==='partner'&&(r.from===child.id||r.to===child.id));
          const partnerNode=partnerRel?getTempNode(nodes,partnerRel.from===child.id?partnerRel.to:partnerRel.from):null;
          const general=[...body.matchAll(/(?:育有|有)\s*(?:1|一)?\s*(子|女)\s*[（(]?\s*(\d{1,3})\s*歲?\s*[)）]?/g)];
          general.forEach(cm=>{
            const exists=nodes.some(n=>n.age===cm[2]&&n.name===cm[1]);
            if(!exists){
              const c=newNode({name:cm[1],sex:cm[1]==='子'?'male':'female',age:cm[2]});
              rel(child,c,'parent');
              if(partnerNode) rel(partnerNode,c,'parent');
            }
          });
        }
      }
    }
    if(proband&&spouse) rel(spouse,proband,'partner',{status:'married'});
    if(proband){
      children.forEach(c=>{
        rel(proband,c,'parent');
        if(spouse) rel(spouse,c,'parent');
      });
    }
    return {nodes,relations};
  }

  function getTempNode(nodes,id){return nodes.find(n=>n.id===id)}

  function applyParsed(raw){
    const parsed=parseQuickInput(raw);
    if(!parsed.nodes.length) return showToast('沒有辨識到人物資料');
    snapshot();
    state=defaultState();
    state.nodes=parsed.nodes;
    state.relations=parsed.relations;
    autoLayout(false);
    render();persist();showToast('已產生家系圖，可繼續拖曳與編輯');
  }

  function autoLayout(withSnapshot=true){
    if(withSnapshot) snapshot();
    const nodes=state.nodes;
    if(!nodes.length) return;

    const partnerRels=state.relations.filter(r=>r.type==='partner');
    const parentRels=state.relations.filter(r=>r.type==='parent');

    // 以伴侶關係建立家庭單位（component）。多次婚配會保留在同一單位中。
    const parent={};
    nodes.forEach(n=>parent[n.id]=n.id);
    const find=id=>parent[id]===id?id:(parent[id]=find(parent[id]));
    const union=(a,b)=>{a=find(a);b=find(b);if(a!==b)parent[b]=a;};
    partnerRels.forEach(r=>union(r.from,r.to));

    const comps=new Map();
    nodes.forEach(n=>{
      const root=find(n.id);
      if(!comps.has(root)) comps.set(root,[]);
      comps.get(root).push(n);
    });
    const compOf=id=>find(id);

    // 家庭單位之間的親子方向，用最長路徑決定世代。
    const incoming=new Map(), outgoing=new Map();
    comps.forEach((_,id)=>{incoming.set(id,new Set());outgoing.set(id,new Set());});
    parentRels.forEach(r=>{
      const a=compOf(r.from),b=compOf(r.to);
      if(a!==b){outgoing.get(a).add(b);incoming.get(b).add(a);}
    });

    const gen=new Map();
    const roots=[...comps.keys()].filter(id=>incoming.get(id).size===0);
    (roots.length?roots:[...comps.keys()].slice(0,1)).forEach(id=>gen.set(id,0));
    let changed=true,guard=0;
    while(changed&&guard++<30){
      changed=false;
      outgoing.forEach((targets,from)=>{
        if(!gen.has(from)) return;
        targets.forEach(to=>{
          const value=(gen.get(from)||0)+1;
          if(!gen.has(to)||gen.get(to)<value){gen.set(to,value);changed=true;}
        });
      });
    }
    comps.forEach((_,id)=>{if(!gen.has(id))gen.set(id,0)});

    const rows={};
    comps.forEach((members,id)=>{const g=gen.get(id)||0;(rows[g] ||= []).push({id,members});});

    // 同世代排序：先依父母所在位置，再依長、次、三、四等出生序。
    const birthOrder=comp=>{
      const names=comp.members.map(n=>n.name||'');
      const map=[['長',1],['次',2],['三',3],['四',4],['五',5],['六',6],['七',7],['八',8],['九',9],['么',10]];
      for(const [key,value] of map){ if(names.some(n=>n.startsWith(key))) return value; }
      return 50;
    };
    const parentCenter=comp=>{
      const xs=[];
      comp.members.forEach(member=>{
        parentRels.filter(r=>r.to===member.id).forEach(r=>{const p=getNode(r.from);if(p)xs.push(p.x);});
      });
      return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null;
    };

    Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(g=>{
      const row=rows[g].sort((a,b)=>{
        if(g>0){
          const ax=parentCenter(a),bx=parentCenter(b);
          if(ax!==null&&bx!==null&&Math.abs(ax-bx)>24) return ax-bx;
        }
        const pa=a.members.some(n=>n.proband)?-100:0;
        const pb=b.members.some(n=>n.proband)?-100:0;
        return pa-pb || birthOrder(a)-birthOrder(b) || a.members.map(n=>n.name||'').join('').localeCompare(b.members.map(n=>n.name||'').join(''),'zh-Hant');
      });
      const widths=row.map(c=>c.members.length>2?320:c.members.length===2?210:130);
      const total=widths.reduce((a,b)=>a+b,0)+Math.max(0,row.length-1)*70;
      let cursor=700-total/2;
      row.forEach((comp,idx)=>{
        const width=widths[idx];
        const center=cursor+width/2;
        const baseY=150+g*250;
        const members=comp.members;
        const degree=id=>partnerRels.filter(r=>r.from===id||r.to===id).length;
        if(members.length===1){
          members[0].x=center;members[0].y=baseY;
        }else if(members.length===2){
          const ordered=[...members].sort((a,b)=>(b.proband?1:0)-(a.proband?1:0));
          ordered[0].x=center-70;ordered[1].x=center+70;
          ordered[0].y=ordered[1].y=baseY;
        }else{
          const focal=[...members].sort((a,b)=>degree(b.id)-degree(a.id))[0];
          const partners=members.filter(n=>n.id!==focal.id).sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-Hant'));
          focal.x=center-70;focal.y=baseY;
          partners.forEach((n,i)=>{
            n.x=center+100;
            n.y=baseY+(i-(partners.length-1)/2)*125;
          });
        }
        cursor+=width+70;
      });
    });

    // 同一世代保留固定間距，避免不同家庭單位互相重疊。

    render();persist();
  }

  function clearAll(){
    if(!confirm('確定要清空目前家系圖嗎？')) return;
    snapshot(); state=defaultState();render();persist();
  }

  function download(filename,content,type){
    const blob=new Blob([content],{type});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }

  function getCleanSvgString(){
    const clone=canvas.cloneNode(true);
    clone.querySelector('#selectionLayer')?.remove();
    clone.setAttribute('xmlns',SVG_NS);
    clone.setAttribute('width','1400');clone.setAttribute('height','900');
    return new XMLSerializer().serializeToString(clone);
  }

  function exportSvg(){ download('家系圖.svg',getCleanSvgString(),'image/svg+xml;charset=utf-8'); }

  function exportPng(){
    const svg=getCleanSvgString();
    const blob=new Blob([svg],{type:'image/svg+xml'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=2100;c.height=1350;
      const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='家系圖.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png');
    };
    img.src=url;
  }

  function saveProject(){ download('家系圖專案.json',JSON.stringify({...state,selected:null},null,2),'application/json;charset=utf-8'); }

  function loadProject(file){
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!data.nodes||!data.relations) throw new Error('格式錯誤');
        snapshot();state={...defaultState(),...data,selected:null};render();persist();showToast('專案已載入');
      }catch(e){showToast('無法載入：檔案格式不正確')}
    };
    reader.readAsText(file);
  }

  function setZoom(factor){
    const vb=canvas.viewBox.baseVal;
    const cx=vb.x+vb.width/2,cy=vb.y+vb.height/2;
    const nw=clamp(vb.width*factor,500,2800),nh=nw*900/1400;
    vb.x=cx-nw/2;vb.y=cy-nh/2;vb.width=nw;vb.height=nh;updateZoomButton();
  }
  function resetZoom(){canvas.setAttribute('viewBox','0 0 1400 900');updateZoomButton()}
  function fitContent(){
    const els=[...state.nodes.map(n=>({x:n.x-50,y:n.y-50,w:100,h:110})),...state.frames.map(f=>({x:f.x,y:f.y,w:f.width,h:f.height})),...state.texts.map(t=>({x:t.x,y:t.y-40,w:Math.max(100,(t.text||'').length*24),h:60}))];
    if(!els.length) return resetZoom();
    const minX=Math.min(...els.map(e=>e.x))-70,minY=Math.min(...els.map(e=>e.y))-70,maxX=Math.max(...els.map(e=>e.x+e.w))+70,maxY=Math.max(...els.map(e=>e.y+e.h))+70;
    const w=maxX-minX,h=maxY-minY,ratio=1400/900;
    let vw=w,vh=h;if(vw/vh>ratio)vh=vw/ratio;else vw=vh*ratio;
    canvas.setAttribute('viewBox',`${minX-(vw-w)/2} ${minY-(vh-h)/2} ${vw} ${vh}`);updateZoomButton();
  }
  function updateZoomButton(){const vb=canvas.viewBox.baseVal;$('#zoomResetBtn').textContent=Math.round(1400/vb.width*100)+'%'}

  $('#parseBtn').addEventListener('click',()=>applyParsed($('#quickInput').value));
  $('#sampleBtn').addEventListener('click',()=>{$('#quickInput').value=`個案：女性，80歲，在家照顧\n配偶：男性，已歿\n長男：55歲，婚配三次，第一次有1子28歲，第二次無子女，第三次有1女16歲\n次女：50歲，未婚\n三女：48歲，已婚，育有一子(15歲)`;});
  $$('[data-add-node]').forEach(b=>b.addEventListener('click',()=>addNode(b.dataset.addNode)));
  $('#addFrameBtn').addEventListener('click',addFrame);
  $('#addTextBtn').addEventListener('click',addText);
  $('#autoLayoutBtn').addEventListener('click',()=>autoLayout(true));
  $('#undoBtn').addEventListener('click',undo);
  $('#redoBtn').addEventListener('click',redo);
  $('#clearBtn').addEventListener('click',clearAll);
  $('#saveProjectBtn').addEventListener('click',saveProject);
  $('#loadProjectInput').addEventListener('change',e=>{if(e.target.files[0])loadProject(e.target.files[0]);e.target.value=''});
  $('#exportSvgBtn').addEventListener('click',exportSvg);
  $('#exportPngBtn').addEventListener('click',exportPng);
  $('#printBtn').addEventListener('click',()=>window.print());
  $('#zoomInBtn').addEventListener('click',()=>setZoom(.85));
  $('#zoomOutBtn').addEventListener('click',()=>setZoom(1.18));
  $('#zoomResetBtn').addEventListener('click',resetZoom);
  $('#fitBtn').addEventListener('click',fitContent);

  const relationDialog=$('#relationDialog');
  $('#addRelationBtn').addEventListener('click',()=>{
    if(state.nodes.length<2) return showToast('至少需要兩位人物');
    populateRelationSelects();relationDialog.showModal();
  });
  $('#cancelRelationBtn').addEventListener('click',()=>relationDialog.close());
  $('#relationType').addEventListener('change',()=>$('#partnerStatusField').style.display=$('#relationType').value==='partner'?'grid':'none');
  $('#confirmRelationBtn').addEventListener('click',()=>{
    const from=$('#relationFrom').value,to=$('#relationTo').value;
    if(from===to) return showToast('起點與終點不能相同');
    snapshot();
    addRelation(from,to,$('#relationType').value,{status:$('#partnerStatus').value,label:$('#relationLabel').value.trim()});
    relationDialog.close();render();persist();
  });

  document.addEventListener('keydown',evt=>{
    const tag=document.activeElement?.tagName;
    if((evt.key==='Delete'||evt.key==='Backspace') && state.selected && !['INPUT','TEXTAREA','SELECT'].includes(tag)){
      const {kind,id}=state.selected;deleteSelected(kind,id);
    }
    if((evt.ctrlKey||evt.metaKey)&&evt.key.toLowerCase()==='z'){evt.preventDefault();evt.shiftKey?redo():undo()}
    if((evt.ctrlKey||evt.metaKey)&&evt.key.toLowerCase()==='y'){evt.preventDefault();redo()}
  });

  restore();
  if(!state.nodes.length){ applyParsed($('#quickInput').value); history=[]; future=[]; }
  else render();
})();
</script>
</body>
</html>
